[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paranam-trainer"
version = "0.5.8"
description = "Self-contained ParaNAM capture and HyperA2 training wizard"
authors = [
    {name = "Steven Atkinson", email = "steven@atkinson.mn"},
    {name = "Phillip Self"},
    {name = "DLC86"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "librosa",
    "matplotlib",
    "numpy",
    "pydantic>=2.0.0",
    "pytorch_lightning<=2.6.1",  # Issue 656
    "scipy",  # Required by auraloss
    "sounddevice",
    "tensorboard",
    "torch",
    # `transformers` is not required, but if you have it, it needs to be recent
    # enough so I'm adding it.
    "PySide6>=6.8,<7",
    "filelock",
    "psutil",
    "tqdm",
    "wavio>=0.0.5",
]


[project.optional-dependencies]
# Optional features
transformers-compat = [
    "transformers>=4",  # Issue-294
    "numpy",  # NB: Older PyTorch versions require numpy<2
]

test = [
    "pytest",
    "pytest-mock",
    "requests",
]

# The guided parametric capture desktop app (nam-capture)
capture-app = [
    "PySide6",
]

[project.urls]
homepage = "https://github.com/sdatkinson/"

[project.gui-scripts]
paranam-trainer = "paranam.__main__:main"

[project.scripts]
nam = "nam.cli:nam_gui"
nam-capture = "nam.capture.gui.main:main"
nam-full = "nam.cli:nam_full"
nam-full-parametric = "nam.cli:nam_full_parametric"
nam-hello-world = "nam.cli:nam_hello_world"

[tool.setuptools]
include-package-data = true
packages = [
    "paranam",
    "nam",
    "nam.capture",
    "nam.capture.gui",
    "nam._dependencies",
    "nam._dependencies.auraloss",
    "nam.train",
    "nam.train._resources",
    "nam.train.gui",
    "nam.train.gui._resources",
    "nam.models",
    "nam.models._resources",
    "nam.models.parametric",
    "nam.models.wavenet",
]

[tool.setuptools.package-data]
"paranam" = ["assets/*.wav", "assets/*.ttf", "assets/*.txt", "assets/*.json", "assets/*.png", "assets/*.svg", "assets/irs/*", "assets/previews/*", "native/*.dll", "native/*.so", "native/*.dylib"]
"nam.train._resources" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-x"
