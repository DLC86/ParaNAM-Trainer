name: ParaNAM macOS ARM64 installer rebuild (artifact only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-macos-arm64-artifact.yml'
permissions:
  contents: read
jobs:
  build-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bundled training engine
        run: python -m pip install --no-cache-dir "torch==2.10.0" --index-url "https://pypi.org/simple"
      - name: Install application and build dependencies
        run: python -m pip install --no-cache-dir -c packaging/constraints-macos-15.txt "numpy>=1.26,<3" "pytorch-lightning==2.6.1" "PySide6==6.8.3" "pyinstaller>=6.13,<7" "pytest" "pytest-mock" "Pillow" -e .
      - name: Build native playback engine
        run: python packaging/native_engine.py
      - name: Targeted capture and HyperA2 regression checks
        run: python -m pytest tests/paranam/test_control_dialog_knob.py tests/paranam/test_plan_rules.py tests/capture/test_switch_controls.py tests/parametric/test_hyper_a2_packed.py -q -o addopts= --basetemp .test-temp
      - name: Freeze application and package macOS ARM64 DMG
        run: python packaging/build.py --flavor Metal
      - name: Upload installer as a workflow artifact only
        uses: actions/upload-artifact@v4
        with:
          name: ParaNAM-0.8.4-macOS-arm64-rebuild
          path: installers/ParaNAM-Trainer-0.8.4-macOS-arm64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
