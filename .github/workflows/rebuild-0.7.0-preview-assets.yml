name: Temporary 0.7.0 preview asset refresh
# Rebuild after removing the legacy ESR alias check
# Rebuild after capture notification and CI fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rebuild-0.7.0-preview-assets.yml']
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          TARGET: all
        run: |
          python3 - <<'PY'
          import json, os
          targets = json.load(open('packaging/targets.json'))
          selected = [t for t in targets if os.environ['TARGET'] in ('all', t['id'])]
          assert selected, 'Unknown installer target'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(selected) + '\n')
          PY
  build:
    needs: targets
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free space for GPU component verification
        if: runner.os == 'Linux'
        run: |
          # Ephemeral GitHub runner image only; none of these SDKs is used here.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Linux native audio and Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libportaudio2 libasound2 libpulse0 libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libfontconfig1 libdbus-1-3
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Install bundled training engine
        run: python -m pip install --no-cache-dir "torch==${{ matrix.torch }}" --index-url "${{ matrix.index }}"
      - name: Install application and build dependencies
        run: python -m pip install --no-cache-dir -c packaging/constraints-${{ matrix.os }}.txt "${{ matrix.numpy }}" "pytorch-lightning==2.6.1" "PySide6==6.8.3" "pyinstaller>=6.13,<7" "pytest" "pytest-mock" "Pillow" -e .
      - name: Build native playback engine
        run: python packaging/native_engine.py
      - name: Test wizard, queue, native playback and real pause/resume training
        run: python -m pytest tests/paranam tests/capture tests/parametric/test_a2_recipe.py tests/parametric/test_hyper_a2_packed.py -q -o addopts= --basetemp .test-temp
      - name: Freeze application and package installer
        run: python packaging/build.py --flavor ${{ matrix.flavor }}
      - name: Verify optional NVIDIA engine inside the frozen CPU app
        if: runner.os != 'macOS'
        shell: bash
        env:
          PARANAM_RUNTIME_ROOT: ${{ github.workspace }}/build/optional-gpu
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python packaging/validate_bundle.py "dist/ParaNAM Trainer/ParaNAM Trainer.exe" build
          else
            python packaging/validate_bundle.py "dist/ParaNAM Trainer/ParaNAM Trainer" build
          fi
      - name: Upload tested installer to the preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.7.0-preview installers/* --clobber
  update-notes:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update 0.7.0 preview notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.7.0-preview --notes-file docs/release-0.7.0.md --prerelease --draft=false --latest=false
