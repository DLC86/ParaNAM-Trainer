name: Build ParaNAM Trainer 0.8.0 beta 3
on:
  push:
    branches: ['feature/synthetic-mute-captures-080-beta3']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: paranam-080-beta3
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y clang libportaudio2 libegl1 libopengl0
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'PySide6==6.8.3' -e '.[test]'
      - name: Check syntax of new training paths
        run: python -m compileall -q paranam nam/train tests/paranam/test_synthetic_mute_beta3.py
      - name: Set up native playback engine
        run: |
          git config --global url."https://github.com/eigenteam/eigen-git-mirror.git".insteadOf "https://gitlab.com/libeigen/eigen"
          for attempt in 1 2 3; do
            if python packaging/native_engine.py; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Check beta 3 synthetic mute regressions
        run: >-
          python -m pytest -q -o addopts= --basetemp .test-mute
          tests/paranam/test_synthetic_mute_beta3.py
          tests/paranam/test_hypera2_defaults059.py
          tests/paranam/test_advanced_training.py::test_synthetic_mute_reference_is_only_visible_option
      - name: Test beta 3 full regression suite
        run: >-
          python -m pytest -q -o addopts= --basetemp .test-temp
          tests/paranam tests/capture tests/test_nam/test_data.py
          tests/parametric/test_dataset.py tests/parametric/test_a2_recipe.py
          tests/parametric/test_hyper_a2.py tests/parametric/test_hyper_a2_packed.py
          tests/parametric/test_train.py
  prepare_draft:
    needs: test
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or refresh the beta 3 draft, then launch native installers
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          test "$latest" = "$GITHUB_SHA"
          tag="v0.8.0-beta.3"
          if gh api "repos/$GH_REPO/releases/tags/$tag" > existing.json 2>/dev/null; then
            id="$(jq -r '.id' existing.json)"
            test "$(jq -r '.draft' existing.json)" = true
            gh api --method PATCH "repos/$GH_REPO/releases/$id" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="ParaNAM Trainer 0.8.0 beta 3" \
              -f body="$(cat docs/release-0.8.0-beta3.md)" \
              -F draft=true -F prerelease=true > release.json
          else
            gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
              -f name="ParaNAM Trainer 0.8.0 beta 3" \
              -f body="$(cat docs/release-0.8.0-beta3.md)" \
              -F draft=true -F prerelease=true > release.json
          fi
          id="$(jq -r '.id' release.json)"
          test "$(jq -r '.draft' release.json)" = true
          gh workflow run paranam-installers.yml --ref "$GITHUB_REF_NAME" \
            -f target=all -f keep_draft=true -f release_id="$id"
          echo "Dispatched five installers to beta 3 draft $id"
