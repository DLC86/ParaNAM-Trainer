name: Refresh draft 0.7.5 — verified native installers

# Automatically build once on workflow creation, or dispatch for future updates.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-v075-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-v075-verified-assets
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        run: |
          python3 - <<'PY'
          import json, os
          with open('packaging/targets.json') as stream:
              targets = json.load(stream)
          assert {t['id'] for t in targets} == {
              'windows', 'linux', 'macos-arm64', 'macos-intel'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(targets) + '\n')
          PY

  build:
    needs: targets
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prefer pinned Eigen GitHub mirror
        shell: bash
        run: git config --global url."https://github.com/eigenteam/eigen-git-mirror.git".insteadOf "https://gitlab.com/libeigen/eigen"
      - name: Verify exact draft and source version
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          release = json.loads(subprocess.check_output(
              ['gh','api','repos/'+os.environ['GH_REPO']+'/releases/444515223']))
          assert release['draft'] and not release['prerelease'], 'Draft must remain unpublished'
          assert release['tag_name'] == 'v0.7.5' or release['tag_name'].startswith('untagged-')
          assert release['name'] == 'ParaNAM Trainer 0.7.5'
          assert release['target_commitish'] in ('b4aa4f25f9d21bf269864699a497b56e0a35f60e', 'main', os.environ['GITHUB_SHA'])
          assert '__version__ = "0.7.5"' in Path('paranam/__init__.py').read_text()
          PY
      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Linux audio and Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libportaudio2 libasound2 libpulse0 libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libfontconfig1 libdbus-1-3
      - name: Enable MSVC for Win32 launcher
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Install bundled training engine
        run: python -m pip install --no-cache-dir "torch==${{ matrix.torch }}" --index-url "${{ matrix.index }}"
      - name: Install application and build dependencies
        run: python -m pip install --no-cache-dir -c packaging/constraints-${{ matrix.os }}.txt "${{ matrix.numpy }}" "pytorch-lightning==2.6.1" "PySide6==6.8.3" "pyinstaller>=6.13,<7" "pytest" "pytest-mock" "Pillow" -e .
      - name: Build optimized native Compare engine
        run: python packaging/native_engine.py
      - name: Test Projects, metadata, Compare, training and singleton guard
        run: python -m pytest tests/paranam tests/capture tests/parametric/test_a2_recipe.py tests/parametric/test_hyper_a2_packed.py -q -o addopts= --basetemp .test-temp
      # Windows packaging also smoke-tests the native launcher and its
      # inherited stdout pipe for Inno Setup's PNGPU progress protocol.
      - name: Freeze application and package native installer
        run: python packaging/build.py --flavor ${{ matrix.flavor }}
      - name: Verify frozen CPU app and optional NVIDIA engine
        if: runner.os != 'macOS'
        shell: bash
        env:
          PARANAM_RUNTIME_ROOT: ${{ github.workspace }}/build/optional-gpu
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python packaging/validate_bundle.py "dist/ParaNAM Trainer/ParaNAM Trainer.exe" build
          else
            python packaging/validate_bundle.py "dist/ParaNAM Trainer/ParaNAM Trainer" build
          fi
      - name: Stage tested packages on existing 0.7.5 draft (originals untouched)
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:12}"
          shopt -s nullglob
          packages=(installers/*)
          test ${#packages[@]} -ge 1
          for package in "${packages[@]}"; do
            test -f "$package"
            test "$(wc -c < "$package")" -gt 100000
            staged="$package.staged-$short"
            mv "$package" "$staged"
            # Draft tags can be temporary untagged-* names; upload by release ID.
            upload_args=(
              --fail-with-body --silent --show-error --retry 3
              --retry-delay 5 --retry-all-errors --max-time 900
              -H "Authorization: Bearer $GH_TOKEN"
              -H "Accept: application/vnd.github+json"
              -H "Content-Type: application/octet-stream"
              --data-binary "@$staged"
            )
            curl "${upload_args[@]}" "https://uploads.github.com/repos/$GH_REPO/releases/444515223/assets?name=$(basename "$staged")" > /dev/null
          done

  finalize:
    needs: [targets, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify all five installers and safely update the unpublished draft
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repo = os.environ['GH_REPO']
          sha = os.environ['SOURCE_SHA']
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repo}'
          release_id = 444515223
          prefix = 'ParaNAM-Trainer-0.7.5-'
          names = {
              prefix + suffix for suffix in (
                  'Windows-x64-Setup.exe', 'Linux-amd64.deb',
                  'Linux-x86_64.tar.gz', 'macOS-arm64.dmg', 'macOS-x86_64.dmg')
          }
          short = sha[:12]
          headers = {'Authorization': 'Bearer ' + token,
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          def api(method, path, data=None):
              payload = None if data is None else json.dumps(data).encode('utf-8')
              h = dict(headers)
              if payload is not None:
                  h['Content-Type'] = 'application/json'
              request = urllib.request.Request(
                  base + path, method=method, data=payload, headers=h)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return None if response.status == 204 else json.load(response)

          release = api('GET', '/releases/' + str(release_id))
          assert release['draft'] and not release['prerelease'], 'Never modify a published release'
          assert release['name'] == 'ParaNAM Trainer 0.7.5', 'Unexpected draft release'
          assert (release['tag_name'] == 'v0.7.5'
                  or release['tag_name'].startswith('untagged-')), 'Unexpected release tag'
          assert release['target_commitish'] in ('b4aa4f25f9d21bf269864699a497b56e0a35f60e', sha, 'main'), (
              'Draft source changed unexpectedly')
          current = api('GET', '/git/ref/heads/main')['object']['sha']
          assert current == sha, 'Main changed during build; refusing stale installers'

          assets = {a['name']: a for a in release['assets']}
          existing = {name: assets[name] for name in names if name in assets}
          staged_names = {name + '.staged-' + short for name in names}
          staged = {name: assets[name + '.staged-' + short] for name in names}
          stale = {
              name: asset for name, asset in assets.items()
              if name not in staged_names and any(
                  name.startswith(pkg + '.staged-')
                  and re.fullmatch(r'[0-9a-f]{12}', name[len(pkg + '.staged-'):])
                  for pkg in names)
          }
          assert set(assets) == set(existing) | staged_names | set(stale), (
              'Unexpected draft assets; refusing to replace anything')
          assert len(staged) == 5
          for name, asset in staged.items():
              assert asset['state'] == 'uploaded' and asset['size'] > 100000, (
                  'Missing or invalid native asset: ' + name)

          def rename(asset, name):
              return api('PATCH', '/releases/assets/' + str(asset['id']),
                         {'name': name})
          def remove(asset):
              api('DELETE', '/releases/assets/' + str(asset['id']))

          # For a first build there are no originals; on subsequent builds
          # retain each original until its verified replacement is in place.
          for name in sorted(names):
              old = existing.get(name)
              if old:
                  rename(old, name + '.backup-' + short)
              try:
                  rename(staged[name], name)
              except Exception:
                  if old:
                      rename(old, name)
                  raise
              if old:
                  remove(old)
              print('Installed verified draft asset:', name, flush=True)

          for name, asset in sorted(stale.items()):
              remove(asset)
              print('Removed old partial staging asset:', name, flush=True)

          verified = api('GET', '/releases/' + str(release_id))
          assert verified['draft'] and not verified['prerelease']
          result_assets = {a['name']: a for a in verified['assets']}
          assert set(result_assets) == names
          for name in names:
              expected = staged[name]
              actual = result_assets[name]
              assert actual['id'] == expected['id']
              assert actual['size'] == expected['size']
              assert actual['state'] == 'uploaded'
              if expected.get('digest'):
                  assert actual['digest'] == expected['digest']
          with open('docs/release-0.7.5.md', encoding='utf-8') as notes_file:
              notes = notes_file.read()
          result = api('PATCH', '/releases/' + str(release_id),
                       {'body': notes, 'target_commitish': sha})
          assert result['draft'] and result['target_commitish'] == sha
          print('SUCCESS: all five 0.7.5 installers verified and replaced in draft (unpublished)')
          PY
