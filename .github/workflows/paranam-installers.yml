name: ParaNAM native installers
on:
  workflow_dispatch:
  push:
    tags: ['paranam-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-latest
            flavor: CPU
            torch: '2.10.0'
            index: https://download.pytorch.org/whl/cpu
            numpy: 'numpy>=1.26,<3'
          - os: windows-latest
            flavor: CUDA
            torch: '2.10.0'
            index: https://download.pytorch.org/whl/cu128
            numpy: 'numpy>=1.26,<3'
          - os: ubuntu-22.04
            flavor: CPU
            torch: '2.10.0'
            index: https://download.pytorch.org/whl/cpu
            numpy: 'numpy>=1.26,<3'
          - os: ubuntu-22.04
            flavor: CUDA
            torch: '2.10.0'
            index: https://download.pytorch.org/whl/cu128
            numpy: 'numpy>=1.26,<3'
          - os: macos-15
            flavor: Metal
            torch: '2.10.0'
            index: https://pypi.org/simple
            numpy: 'numpy>=1.26,<3'
          - os: macos-15-intel
            flavor: CPU
            torch: '2.2.2'
            index: https://pypi.org/simple
            numpy: 'numpy==1.26.4'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux native audio and Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libasound2 libpulse0 libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Install bundled training engine
        run: python -m pip install --no-cache-dir "torch==${{ matrix.torch }}" --index-url "${{ matrix.index }}"
      - name: Install application and build dependencies
        run: python -m pip install --no-cache-dir "${{ matrix.numpy }}" "pytorch-lightning==2.6.1" "PySide6>=6.8,<7" "pyinstaller>=6.13,<7" "pytest" "pytest-mock" "Pillow" -e .
      - name: Test wizard and real pause/resume training
        run: python -m pytest tests/paranam -q -o addopts= --basetemp build/test-temp
      - name: Freeze application and package installer
        run: python packaging/build.py --flavor ${{ matrix.flavor }}
      - uses: actions/upload-artifact@v4
        with:
          name: ParaNAM-${{ matrix.os }}-${{ matrix.flavor }}
          path: installers/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

