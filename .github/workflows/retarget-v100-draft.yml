name: Retarget v1.0.0 draft to verified updater tests and rebuild installers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retarget-v100-draft.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  retarget:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Cancel obsolete installer run, retarget draft, and dispatch verified builds
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx '__version__ = "1.0.0"' paranam/__init__.py
          grep -Fx 'version = "1.0.0"' pyproject.toml
          old_run=42916511391
          gh run cancel "$old_run" -R "$GH_REPO" || true
          status=""
          for attempt in $(seq 1 100); do
            status=$(gh api "repos/$GH_REPO/actions/runs/$old_run" --jq '.status')
            if [ "$status" = completed ]; then break; fi
            sleep 5
          done
          test "$status" = completed
          release_id=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "v1.0.0" and .draft == true and .prerelease == true) | .id')
          test "$release_id" = 441009567
          tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/v1.0.0" --jq '.object.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            test "$tag_sha" = "b50b2e8f6c182bfe22bd3496f314eefc7aaebbf0"
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/v1.0.0" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" \
            -f target_commitish="$GITHUB_SHA" >/dev/null
          test "$(gh api "repos/$GH_REPO/releases/$release_id" --jq .target_commitish)" = "$GITHUB_SHA"
          gh workflow run paranam-installers.yml --ref v1.0.0 \
            -f target=all -f keep_draft=true -f release_id="$release_id"
          echo "Rebuilt source: $GITHUB_SHA; draft $release_id left unpublished"
