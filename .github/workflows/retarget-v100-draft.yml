name: Retarget v1.0.0 draft to verified updater tests and rebuild installers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retarget-v100-draft.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  retarget:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Cancel obsolete installer run, retarget draft, and dispatch verified builds
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx '__version__ = "1.0.0"' paranam/__init__.py
          grep -Fx 'version = "1.0.0"' pyproject.toml
          old_run=42918380589
          gh run cancel "$old_run" -R "$GH_REPO" || true
          status=""
          for attempt in $(seq 1 100); do
            status=$(gh api "repos/$GH_REPO/actions/runs/$old_run" --jq '.status')
            if [ "$status" = completed ]; then break; fi
            sleep 5
          done
          test "$status" = completed
          release_id=441009567
          # Draft releases may temporarily have an untagged-* API name after
          # retargeting. Use the existing verified release ID as the source of truth.
          test "$(gh api "repos/$GH_REPO/releases/$release_id" --jq .draft)" = true
          test "$(gh api "repos/$GH_REPO/releases/$release_id" --jq .prerelease)" = true
          tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/v1.0.0" --jq '.object.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            test "$tag_sha" = "3f1ba690fb2bbabca09801d1caef7aa1ef07b79b"
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/v1.0.0" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name=v1.0.0 -f target_commitish="$GITHUB_SHA" >/dev/null
          test "$(gh api "repos/$GH_REPO/releases/$release_id" --jq .target_commitish)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GH_REPO/releases/$release_id" --jq .tag_name)" = v1.0.0
          # Preserve the existing notes; describe this source refresh in-place.
          notes=$(gh api "repos/$GH_REPO/releases/$release_id" --jq '.body')
          marker="### Draft refresh: resumed-training indices and Linear Volume"
          if [[ "$notes" != *"$marker"* ]]; then
            notes="$notes

          $marker

          - Fixed final PNAM exports from training begun on v0.7.2 and finished on
            v1.0.0: neural controls now receive their Plan display \`index\` in the
            top-level config and both Lite/Full submodels, including completed members.
          - Clean/Linear Volume is exported exclusively as
            \`extensions.linear_volume\`, not as the legacy
            \`ParametricOutputGain\` wrapper or as a hypernetwork input.
            Legacy wrapper-based snapshot files are converted to extension-only format
            without changing their weights; saved curves are restored when an older
            intermediate export omitted the extension.
          - Added regression tests for resumed legacy training and single-extension
            volume exports. All five installers are rebuilt from commit
            \`$GITHUB_SHA\`. This release **remains a draft**."
            gh api -X PATCH "repos/$GH_REPO/releases/$release_id" \
              -f body="$notes" -f tag_name=v1.0.0 >/dev/null
          fi
          test "$(gh api "repos/$GH_REPO/releases/$release_id" --jq .draft)" = true
          gh workflow run paranam-installers.yml --ref v1.0.0 \
            -f target=all -f keep_draft=true -f release_id="$release_id"
          echo "Rebuilt source: $GITHUB_SHA; draft $release_id left unpublished"
