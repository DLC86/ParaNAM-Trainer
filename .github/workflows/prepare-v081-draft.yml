name: Prepare and build ParaNAM Trainer 0.8.1 draft
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v081-draft.yml'
      - 'paranam/updates.py'
      - 'paranam/wizard.py'
      - 'paranam/evaluation.py'
      - 'paranam/training.py'
      - 'paranam/training_queue.py'
      - 'nam/capture/session.py'
      - 'tests/paranam/test_updates.py'
      - 'tests/paranam/test_release_081.py'
      - 'tests/paranam/test_evaluation.py'
      - 'tests/capture/test_session.py'
      - 'docs/release-0.8.1.md'
      - 'paranam/__init__.py'
      - 'pyproject.toml'
permissions:
  contents: write
  actions: write
concurrency:
  group: paranam-draft-v0.8.1
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Require passing CI for the exact main commit before release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grep -qx '__version__ = "0.8.1"' paranam/__init__.py
          grep -qx 'version = "0.8.1"' pyproject.toml
          for attempt in $(seq 1 270); do
            conclusion="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=50" --jq '.workflow_runs[] | select(.name == "ParaNAM tests") | .conclusion' | head -n 1)"
            if [[ "$conclusion" == success ]]; then break; fi
            if [[ -n "$conclusion" && "$conclusion" != null ]]; then
              echo "::error::Exact commit tests ended with $conclusion"
              exit 1
            fi
            sleep 10
          done
          test "$conclusion" = success || { echo "::error::Timed out waiting for tests"; exit 1; }
          latest="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          test "$latest" = "$GITHUB_SHA" || { echo "::error::Main advanced after test run"; exit 1; }
      - name: Create 0.8.1 draft and dispatch all native installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.8.1") | .id' | head -n 1)"
          if [[ -n "$existing" ]]; then
            test "$(gh api "repos/$GH_REPO/releases/$existing" --jq .draft)" = true
            gh api --method PATCH "repos/$GH_REPO/releases/$existing" \
              -f target_commitish="$GITHUB_SHA" -f name="ParaNAM Trainer 0.8.1" \
              -f body="$(cat docs/release-0.8.1.md)" -F draft=true -F prerelease=true > release.json
          else
            gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="v0.8.1" -f target_commitish="$GITHUB_SHA" \
              -f name="ParaNAM Trainer 0.8.1" \
              -f body="$(cat docs/release-0.8.1.md)" -F draft=true -F prerelease=true > release.json
          fi
          jq -e --arg sha "$GITHUB_SHA" '.draft == true and .target_commitish == $sha' release.json
          release_id="$(jq -r '.id' release.json)"
          gh workflow run paranam-installers.yml --ref main \
            -f target=all -f keep_draft=true -f release_id="$release_id"
          echo "Dispatched native installers for private draft 0.8.1: $release_id"
