name: ParaNAM tests
on:
  push:
    branches: [main, 'beta/**']
    # Pure packaging/installer workflow fixes do not change application
    # behavior. Do not repeat the full ~816-test suite for those commits.
    paths-ignore:
      - '.github/workflows/paranam-installers.yml'
      - '.github/workflows/prepare-v077-draft.yml'
      - '.github/workflows/paranam-tests.yml'
      - 'packaging/pytest_windows_runner.py'
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y clang libportaudio2 libegl1 libopengl0
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      # Use the same Qt runtime as the native installers.
      - run: python -m pip install 'PySide6==6.8.3' -e '.[test]'
      - name: Use verified Eigen GitHub mirror instead of overloaded GitLab
        run: git config --global url."https://github.com/eigenteam/eigen-git-mirror.git".insteadOf "https://gitlab.com/libeigen/eigen"
      - name: Validate switch schema and parametric model exports
        run: python -m pytest tests/parametric/test_spec.py tests/parametric/test_export.py tests/capture/test_switch_controls.py -q -o addopts=
      - name: Verify parametric capture loss normalization
        run: >-
          python -m pytest -q -o addopts=
          tests/parametric/test_train.py::test_rms_normalizes_training_mse_and_preserves_targets
          tests/parametric/test_train.py::test_rms_loss_exponent_adjusts_capture_weight
          tests/parametric/test_train.py::test_rms_loss_exponent_rejects_invalid_values
          tests/parametric/test_train.py::test_snr_uses_manifest_and_explicit_gain_with_trimmed_audio
      - name: Build native playback engine (retry transient Eigen / GitLab fetch errors)
        run: |
          for attempt in 1 2 3; do
            if python packaging/native_engine.py; then exit 0; fi
            echo "Native playback build attempt $attempt failed, possibly external submodule fetch"
            sleep 15
          done
          exit 1
      - run: python -m pytest tests/paranam tests/capture tests/test_nam/test_data.py tests/parametric/test_dataset.py tests/parametric/test_a2_recipe.py tests/parametric/test_hyper_a2.py tests/parametric/test_hyper_a2_packed.py -v -o addopts= --basetemp .test-temp

