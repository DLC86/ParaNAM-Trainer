name: ParaNAM tests
on:
  push:
    branches: [main, 'beta/**', 'feature/switch-option-index-sw']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y clang libportaudio2 libegl1 libopengl0
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - name: Use verified Eigen GitHub mirror instead of overloaded GitLab
        run: git config --global url."https://github.com/eigenteam/eigen-git-mirror.git".insteadOf "https://gitlab.com/libeigen/eigen"
      - name: Validate switch schema and parametric model exports
        run: python -m pytest tests/parametric/test_spec.py tests/parametric/test_export.py tests/capture/test_switch_controls.py -q -o addopts=
      - name: Build native playback engine (retry transient Eigen / GitLab fetch errors)
        run: |
          for attempt in 1 2 3; do
            if python packaging/native_engine.py; then exit 0; fi
            echo "Native playback build attempt $attempt failed, possibly external submodule fetch"
            sleep 15
          done
          exit 1
      - run: python -m pytest tests/paranam tests/capture tests/test_nam/test_data.py tests/parametric/test_dataset.py tests/parametric/test_a2_recipe.py tests/parametric/test_hyper_a2.py tests/parametric/test_hyper_a2_packed.py -q -o addopts= --basetemp .test-temp

