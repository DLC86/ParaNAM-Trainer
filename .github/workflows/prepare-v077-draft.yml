name: Prepare and build ParaNAM Trainer 0.7.7 draft
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v077-draft.yml'
      - '.github/workflows/paranam-installers.yml'
      - 'packaging/pytest_windows_runner.py'
      - 'tests/paranam/test_plan_rules.py'
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Create verified draft and dispatch all native builds
        shell: bash
        run: |
          set -euo pipefail
          grep -qx '__version__ = "0.7.7"' paranam/__init__.py
          grep -qx 'version = "0.7.7"' pyproject.toml
          existing="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.7.7" or .name == "ParaNAM Trainer 0.7.7") | .id' | head -n 1)"
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="v0.7.7" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="ParaNAM Trainer 0.7.7" \
              -f body="$(cat docs/release-0.7.7.md)" \
              -F draft=true -F prerelease=true > release.json
          else
            test "$(gh api "repos/$GH_REPO/releases/$existing" --jq .draft)" = true
            gh api --method PATCH "repos/$GH_REPO/releases/$existing" \
              -f target_commitish="$GITHUB_SHA" \
              -f body="$(cat docs/release-0.7.7.md)" \
              -F draft=true -F prerelease=true > release.json
          fi
          jq -e --arg sha "$GITHUB_SHA" '.draft == true and .target_commitish == $sha' release.json
          release_id="$(jq -r '.id' release.json)"
          echo "Draft ID: $release_id"
          # A previous 0.7.7 build may still be running from an older source
          # revision. Cancel it before dispatch so stale binaries cannot race
          # the corrected draft. The upload step also verifies the source SHA.
          while IFS= read -r previous_run; do
            [[ -n "$previous_run" ]] || continue
            gh api --method POST "repos/$GH_REPO/actions/runs/$previous_run/cancel" || true
          done < <(gh api "repos/$GH_REPO/actions/workflows/paranam-installers.yml/runs?per_page=50" \
            --jq ".workflow_runs[] | select(.head_sha != \"$GITHUB_SHA\" and (.status == \"queued\" or .status == \"in_progress\")) | .id")
          # Only build installers after the repository test workflow for this exact
          # source revision passes. Prevents expensive native builds on broken code.
          tests_conclusion=""
          for attempt in $(seq 1 120); do
            tests_conclusion="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=40" \
              --jq '.workflow_runs[] | select(.name == "ParaNAM tests") | .conclusion' | head -n 1)"
            if [[ "$tests_conclusion" == "success" ]]; then break; fi
            if [[ -n "$tests_conclusion" && "$tests_conclusion" != "null" ]]; then
              echo "::error::Tests for $GITHUB_SHA ended with $tests_conclusion"
              exit 1
            fi
            sleep 10
          done
          test "$tests_conclusion" = "success" || {
            echo "::error::Timed out waiting for tests on $GITHUB_SHA"
            exit 1
          }
          gh workflow run paranam-installers.yml --ref main \
            -f target=all -f keep_draft=true -f release_id="$release_id"
          echo "Native installers dispatched for draft v0.7.7"
