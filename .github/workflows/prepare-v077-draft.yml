name: Prepare and build ParaNAM Trainer 0.7.7 draft
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v077-draft.yml'
      - '.github/workflows/paranam-installers.yml'
      - '.github/workflows/paranam-tests.yml'
      - 'packaging/pytest_windows_runner.py'
      - 'tests/paranam/test_plan_rules.py'
permissions:
  contents: write
  actions: write
concurrency:
  group: paranam-draft-v0.7.7
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create verified draft and dispatch all native builds
        shell: bash
        run: |
          set -euo pipefail
          grep -qx '__version__ = "0.7.7"' paranam/__init__.py
          grep -qx 'version = "0.7.7"' pyproject.toml
          # The draft must include the focused RMS-exponent regression coverage.
          grep -q 'test_rms_loss_exponent_adjusts_capture_weight' .github/workflows/paranam-tests.yml
          # Older release preparations can otherwise finish later, overwrite
          # the draft target commit and cancel the correct installer run.
          # Cancel them before touching the release; allow Actions time to stop.
          for attempt in $(seq 1 12); do
            stale="$(gh api "repos/$GH_REPO/actions/workflows/prepare-v077-draft.yml/runs?per_page=50" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .head_sha != \"$GITHUB_SHA\" and (.status == \"queued\" or .status == \"in_progress\")) | .id")"
            [[ -n "$stale" ]] || break
            while IFS= read -r old_run; do
              [[ -n "$old_run" ]] || continue
              echo "Cancelling stale v0.7.7 preparation $old_run"
              gh api --method POST "repos/$GH_REPO/actions/runs/$old_run/cancel" || true
            done <<< "$stale"
            sleep 5
          done
          latest="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$latest" = "$GITHUB_SHA" || {
            echo "::error::Refusing to publish an obsolete commit ($GITHUB_SHA; current $latest)"
            exit 1
          }
          existing="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.7.7" or .name == "ParaNAM Trainer 0.7.7") | .id' | head -n 1)"
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="v0.7.7" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="ParaNAM Trainer 0.7.7" \
              -f body="$(cat docs/release-0.7.7.md)" \
              -F draft=true -F prerelease=true > release.json
          else
            test "$(gh api "repos/$GH_REPO/releases/$existing" --jq .draft)" = true
            gh api --method PATCH "repos/$GH_REPO/releases/$existing" \
              -f target_commitish="$GITHUB_SHA" \
              -f body="$(cat docs/release-0.7.7.md)" \
              -F draft=true -F prerelease=true > release.json
          fi
          jq -e --arg sha "$GITHUB_SHA" '.draft == true and .target_commitish == $sha' release.json
          release_id="$(jq -r '.id' release.json)"
          echo "Draft ID: $release_id"
          # A previous 0.7.7 build may still be running from an older source
          # revision. Cancel it before dispatch so stale binaries cannot race
          # the corrected draft. The upload step also verifies the source SHA.
          while IFS= read -r previous_run; do
            [[ -n "$previous_run" ]] || continue
            gh api --method POST "repos/$GH_REPO/actions/runs/$previous_run/cancel" || true
          done < <(gh api "repos/$GH_REPO/actions/workflows/paranam-installers.yml/runs?per_page=50" \
            --jq ".workflow_runs[] | select(.head_sha != \"$GITHUB_SHA\" and (.status == \"queued\" or .status == \"in_progress\")) | .id")
          # Reuse an already passing full CI if and ONLY if every file changed
          # since that green commit is a release-workflow/test-wrapper file.
          # A change to application code, tests, native code, packaging behavior,
          # dependencies or docs must still pass CI on this exact SHA.
          passed_sha="$(gh api "repos/$GH_REPO/actions/workflows/paranam-tests.yml/runs?branch=main&status=success&per_page=30" \
            --jq '.workflow_runs[0].head_sha // empty')"
          reuse_ci=false
          if [[ -n "$passed_sha" ]] && git merge-base --is-ancestor "$passed_sha" "$GITHUB_SHA"; then
            mapfile -t changed_paths < <(git diff --name-only "$passed_sha" "$GITHUB_SHA")
            reuse_ci=true
            for changed in "${changed_paths[@]}"; do
              case "$changed" in
                .github/workflows/paranam-installers.yml|.github/workflows/prepare-v077-draft.yml|.github/workflows/paranam-tests.yml|packaging/pytest_windows_runner.py)
                  ;;
                *)
                  reuse_ci=false
                  break
                  ;;
              esac
            done
          fi
          if [[ "$reuse_ci" == true ]]; then
            echo "Reusing passing full CI on $passed_sha: only release tooling changed"
            printf 'Verified workflow-only changes since passing CI:\\n%s\\n' "${changed_paths[@]}"
          else
            # A source change must always have its own passing full CI.
            tests_conclusion=""
            for attempt in $(seq 1 120); do
              tests_conclusion="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=40" \
                --jq '.workflow_runs[] | select(.name == "ParaNAM tests") | .conclusion' | head -n 1)"
              if [[ "$tests_conclusion" == "success" ]]; then break; fi
              if [[ -n "$tests_conclusion" && "$tests_conclusion" != "null" ]]; then
                echo "::error::Tests for $GITHUB_SHA ended with $tests_conclusion"
                exit 1
              fi
              sleep 10
            done
            test "$tests_conclusion" = "success" || {
              echo "::error::Timed out waiting for tests on $GITHUB_SHA"
              exit 1
            }
          fi
          latest="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$latest" = "$GITHUB_SHA" || {
            echo "::error::A newer main commit appeared; skip obsolete installer dispatch"
            exit 1
          }
          gh workflow run paranam-installers.yml --ref main \
            -f target=all -f keep_draft=true -f release_id="$release_id"
          echo "Native installers dispatched for draft v0.7.7"
