name: Run Integration Tests

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  call-integration-tests:
    # The upstream workflow hardcodes sdatkinson/neural-amp-modeler as its
    # trainer checkout. ParaNAM's own suite builds and tests its playback engine.
    if: github.repository == 'sdatkinson/neural-amp-modeler'
    uses: Atkinson-Advanced-Modeling/NamIntegrationTests/.github/workflows/integration-tests.yml@main
    with:
      source_repo: neural-amp-modeler
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
