name: ParaNAM 0.8.6 draft release
on:
  push:
    branches: [feature/capture-recording-integrity-086, feature/filma2-slimmable-086]
    paths:
      - .github/workflows/release-v086-draft.yml
      - paranam/**
      - pyproject.toml
      - nam/**
      - tests/capture/**
      - tests/parametric/test_film_a2.py
      - native/**
      - external/playback-runtime
      - packaging/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paranam-v086-draft-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        run: |
          python3 - <<'PY'
          import json, os
          targets = json.load(open('packaging/targets.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(targets) + '\n')
          PY
  build:
    needs: targets
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free space for Linux bundle
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libportaudio2 libasound2 libpulse0 libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libfontconfig1 libdbus-1-3
      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Install PyTorch
        run: python -m pip install --no-cache-dir "torch==${{ matrix.torch }}" --index-url "${{ matrix.index }}"
      - name: Install application and build dependencies
        run: python -m pip install --no-cache-dir -c packaging/constraints-${{ matrix.os }}.txt "${{ matrix.numpy }}" "pytorch-lightning==2.6.1" "PySide6==6.8.3" "pyinstaller>=6.13,<7" pytest pytest-mock Pillow -e .
      - name: Build native playback engine
        run: python packaging/native_engine.py
      - name: Verify custom-input validation behavior
        if: runner.os != 'Windows'
        run: python -m pytest tests/paranam/test_training.py -k custom_input -q -o addopts= --basetemp .test-temp
      - name: Targeted capture and HyperA2 regression checks
        if: runner.os != 'Windows'
        run: python -m pytest tests/paranam/test_control_dialog_knob.py tests/paranam/test_plan_rules.py tests/capture/test_switch_controls.py tests/parametric/test_hyper_a2_packed.py -q -o addopts= --basetemp .test-temp
      - name: Targeted capture and HyperA2 regression checks (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests/paranam/test_control_dialog_knob.py tests/paranam/test_plan_rules.py tests/capture/test_switch_controls.py tests/parametric/test_hyper_a2_packed.py -q -o addopts= --basetemp .test-temp
      - name: Verify FiLMA2 training, baking and native playback
        if: github.ref == 'refs/heads/feature/filma2-slimmable-086'
        run: python -m pytest tests/parametric/test_film_a2.py -q -o addopts= --basetemp .test-temp
      - name: Model Editor migration tests
        run: python -m pytest tests/paranam/test_model_editor.py -q -o addopts= --basetemp .test-temp
      - name: Model Editor UI regression tests
        run: python tests/run_pytest_isolated.py tests/paranam/test_model_editor_ui.py -q -o addopts= --basetemp .test-temp
      - name: Capture stream integrity regression tests
        run: python -m pytest tests/capture/test_audio.py tests/capture/test_asio_stream.py -q -o addopts= --basetemp .test-temp
      - name: Segment ESR regression tests
        run: python -m pytest tests/parametric/test_train.py tests/paranam/test_advanced_training.py -k segment_esr -q -o addopts= --basetemp .test-temp
      - name: Verify static capture removal, ESR defaults and ASIO metering
        run: >-
          python -m pytest -q -o addopts= --basetemp .test-temp
          tests/paranam/test_static.py::test_static_capture_removal_dialog
          tests/paranam/test_static.py::test_removing_last_static_capture_persists_empty_plan
          tests/paranam/test_static.py::test_static_capture_removal_preserves_shared_and_external_wavs
          tests/paranam/test_hypera2_defaults059.py::test_new_projects_use_requested_preset_and_old_projects_keep_settings
          tests/paranam/test_workflow057.py::test_asio_meter_reports_send_return_and_loopback_without_touching_recording
      - name: Freeze application and package installer
        run: python packaging/build.py --flavor ${{ matrix.flavor }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ParaNAM-${{ matrix.id }}
          path: installers/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  draft-release:
    if: github.ref == 'refs/heads/feature/capture-recording-integrity-086'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ParaNAM-*
          path: installers
          merge-multiple: true
      - name: Replace assets of the existing 0.8.6 draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.8.6
          branch=feature/capture-recording-integrity-086
          release=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "v0.8.6")')
          jq -e --arg branch "$branch" '.draft == true and .target_commitish == $branch' <<< "$release"
          id=$(jq -er .id <<< "$release")
          test "$(gh api "repos/$GH_REPO/commits/$branch" --jq .sha)" = "$GITHUB_SHA"
          packages=(
            installers/ParaNAM-Trainer-0.8.6-Windows-x64-Setup.exe
            installers/ParaNAM-Trainer-0.8.6-Linux-amd64.deb
            installers/ParaNAM-Trainer-0.8.6-Linux-x86_64.tar.gz
            installers/ParaNAM-Trainer-0.8.6-macOS-arm64.dmg
            installers/ParaNAM-Trainer-0.8.6-macOS-x86_64.dmg
          )
          for package in "${packages[@]}"; do test -s "$package"; done
          gh release upload "$tag" "${packages[@]}" --clobber
          updated=$(gh api "repos/$GH_REPO/releases/$id")
          jq -e '.draft == true' <<< "$updated"
          for package in "${packages[@]}"; do
            digest="sha256:$(sha256sum "$package" | cut -d ' ' -f 1)"
            jq -e --arg name "${package##*/}" --arg digest "$digest" \
              '.assets | any(.name == $name and .digest == $digest and .state == "uploaded")' <<< "$updated"
          done
