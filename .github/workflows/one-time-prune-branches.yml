name: One-time prune obsolete branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-prune-branches.yml'
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'DLC86/ParaNAM-Trainer'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only approved branches at verified SHAs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=' ' read -r branch expected; do
            [ -n "$branch" ] || continue
            actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Branch $branch moved from $expected to $actual; refusing deletion."
              exit 1
            fi
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            echo "Deleted $branch at $expected"
          done <<'BRANCHES'
          feature/mute-training-modes-080-beta2 1070babcedb56bcac90ce8e50581c043d1e82539
          feature/synthetic-mute-captures-080-beta3 e13b9ab92b4e2a217f22afa69061e26ddd5e33e4
          fix/v077-rms-snr-normalization 61c21a8f0332019a761bbd7d0e4718e2b8384ed1
          ops/sync-beta3-release-notes 7552e89fdcfc05a8aeb0d3a2fcb62f443183d057
          BRANCHES
